<!DOCTYPE html>
<html>
<head>
    <title>AI Platformer Generator</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; }
        canvas { background: #000; display: block; margin: 20px auto; border: 4px solid #444; }
        .controls { margin-top: 10px; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AI Game Generator</h1>
    <p>Select a Game Type to Generate:</p>
    <button onclick="generateGame('classic')">Classic Mario-Style</button>
    <button onclick="generateGame('neon')">Neon Speedrunner</button>
    <button onclick="generateGame('lava')">Lava Escape</button>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Use <b>Arrow Keys</b> to Move & Jump</p>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x: 50, y: 300, w: 30, h: 30, dy: 0, jump: -12, speed: 5, grounded: false };
let platforms = [];
let goal = { x: 750, y: 300, w: 40, h: 40 };
let currentTheme = { bg: '#000', plat: '#fff', player: '#0f0' };
let gravity = 0.8;

function generateGame(type) {
    // Reset Player
    player.x = 50; player.y = 300; player.dy = 0;
    platforms = [{ x: 0, y: 350, w: 200, h: 50 }]; // Starting floor

    // AI Logic: Procedural Generation based on Type
    if (type === 'classic') {
        currentTheme = { bg: '#5c94fc', plat: '#885010', player: '#f83800' };
        for(let i=1; i<5; i++) {
            platforms.push({ x: i*180, y: 350 - (Math.random()*100), w: 100, h: 20 });
        }
    } 
    else if (type === 'neon') {
        currentTheme = { bg: '#000', plat: '#0ff', player: '#f0f' };
        for(let i=1; i<6; i++) {
            platforms.push({ x: i*150, y: 100 + (Math.random()*200), w: 60, h: 10 });
        }
    }
    else if (type === 'lava') {
        currentTheme = { bg: '#400', plat: '#ff4500', player: '#ffff00' };
        for(let i=1; i<5; i++) {
            platforms.push({ x: i*160, y: 300 - (i*30), w: 80, h: 20 });
        }
    }
    
    goal.x = 720;
    goal.y = platforms[platforms.length-1].y - 40;
}

// Input Handling
let keys = {};
window.onkeydown = (e) => keys[e.key] = true;
window.onkeyup = (e) => keys[e.key] = false;

function update() {
    if (keys['ArrowRight']) player.x += player.speed;
    if (keys['ArrowLeft']) player.x -= player.speed;
    if (keys['ArrowUp'] && player.grounded) {
        player.dy = player.jump;
        player.grounded = false;
    }

    player.dy += gravity;
    player.y += player.dy;
    player.grounded = false;

    // Collision Detection
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y && player.dy > 0) {
            player.grounded = true;
            player.dy = 0;
            player.y = p.y - player.h;
        }
    });

    if(player.y > canvas.height) player.x = 50, player.y = 300; // Reset on fall
}

function draw() {
    ctx.fillStyle = currentTheme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = currentTheme.plat;
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    ctx.fillStyle = currentTheme.player;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.fillStyle = 'gold';
    ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

    requestAnimationFrame(() => { update(); draw(); });
}

generateGame('classic');
draw();
</script>
</body>
</html>
