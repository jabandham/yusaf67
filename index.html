<!DOCTYPE html>
<html>
<head>
    <title>AI Platformer Generator</title>
    <style>
        body { background: #222; color: white; font-family: sans-serif; text-align: center; overflow: hidden; }
        canvas { background: #000; display: block; margin: 20px auto; border: 4px solid #444; }
        .controls { margin-top: 10px; }
        button { padding: 10px 20px; cursor: pointer; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>
    <h1>AI Game Generator</h1>
    <p>Select a Game Type:</p>
    <button onclick="generateGame('classic')">Classic Mario-Style</button>
    <button onclick="generateGame('neon')">Neon Speedrunner</button>
    <button onclick="generateGame('lava')">Lava Escape</button>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p>Controls: <b>WASD / Arrows</b> to Move, <b>Space</b> to Jump</p>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x: 50, y: 300, w: 30, h: 30, dy: 0, jump: -12, speed: 5, grounded: false };
let platforms = [];
let goal = { x: 750, y: 300, w: 40, h: 40 };
let currentTheme = { bg: '#000', plat: '#fff', player: '#0f0' };
let gravity = 0.8;

function generateGame(type) {
    // Reset Player
    player.x = 50; player.y = 300; player.dy = 0;
    platforms = [{ x: 0, y: 350, w: 200, h: 50 }]; // Starting floor

    // AI Logic: Procedural Generation
    if (type === 'classic') {
        currentTheme = { bg: '#5c94fc', plat: '#885010', player: '#f83800' };
        for(let i=1; i<6; i++) {
            platforms.push({ x: i*140, y: 350 - (Math.random()*120), w: 100, h: 20 });
        }
    } 
    else if (type === 'neon') {
        currentTheme = { bg: '#111', plat: '#0ff', player: '#f0f' };
        for(let i=1; i<7; i++) {
            platforms.push({ x: i*130, y: 150 + (Math.random()*200), w: 60, h: 10 });
        }
    }
    else if (type === 'lava') {
        currentTheme = { bg: '#400', plat: '#ff4500', player: '#ffff00' };
        for(let i=1; i<6; i++) {
            platforms.push({ x: i*150, y: 320 - (i*40), w: 80, h: 20 });
        }
    }
    
    // Place goal at the end
    goal.x = platforms[platforms.length-1].x + 20;
    goal.y = platforms[platforms.length-1].y - 40;
}

// Input Handling
let keys = {};

window.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    // Prevent scrolling for Space and Arrows
    if([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) > -1) {
        e.preventDefault();
    }
});

window.addEventListener('keyup', function(e) {
    keys[e.key] = false;
});

function update() {
    // MOVE RIGHT: ArrowRight OR 'd' OR 'D'
    if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.x += player.speed;
    }

    // MOVE LEFT: ArrowLeft OR 'a' OR 'A'
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.x -= player.speed;
    }

    // JUMP: ArrowUp OR 'w' OR 'W' OR Space (' ')
    if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.grounded) {
        player.dy = player.jump;
        player.grounded = false;
    }

    // Physics
    player.dy += gravity;
    player.y += player.dy;
    player.grounded = false;

    // Collision Detection
    platforms.forEach(p => {
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y && player.dy > 0) {
            player.grounded = true;
            player.dy = 0;
            player.y = p.y - player.h;
        }
    });

    // Reset if fallen
    if(player.y > canvas.height) {
        player.x = 50; 
        player.y = 300;
        player.dy = 0;
    }
}

function draw() {
    // Clear Screen
    ctx.fillStyle = currentTheme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Platforms
    ctx.fillStyle = currentTheme.plat;
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    // Draw Player
    ctx.fillStyle = currentTheme.player;
    ctx.fillRect(player.x, player.y, player.w, player.h);
