<!DOCTYPE html>
<html>
<head>
    <title>AI Platformer Generator</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: white; 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            overflow: hidden; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* MENU STYLES */
        #menu {
            border: 2px solid #555;
            padding: 40px;
            background: #222;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h1 { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; color: #00ffcc; }
        p { color: #aaa; margin-bottom: 20px; }
        
        button { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            border: none; 
            border-radius: 5px;
            transition: transform 0.1s;
        }
        button:hover { transform: scale(1.05); }

        /* Theme Button Colors */
        .btn-classic { background: #5c94fc; color: white; }
        .btn-neon { background: #f0f; color: black; box-shadow: 0 0 10px #f0f; }
        .btn-lava { background: #ff4500; color: white; }

        /* GAME CANVAS STYLES */
        #gameContainer { display: none; position: relative; }
        canvas { 
            background: #000; 
            border: 4px solid #444; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        
        #backBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid white;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>AI Game Gen v3.0</h1>
        <p>Select a logic model to generate your level:</p>
        <button class="btn-classic" onclick="startGame('classic')">CLASSIC MARIO</button>
        <button class="btn-neon" onclick="startGame('neon')">NEON SPEEDRUN</button>
        <button class="btn-lava" onclick="startGame('lava')">LAVA ESCAPE</button>
    </div>

    <div id="gameContainer">
        <button id="backBtn" onclick="goToMenu()">← Back to Menu</button>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <p><b>WASD / Space</b> to Jump</p>
    </div>

function startGame(type) {
    // UI Switching
    document.getElementById('menu').style.display = 'none';

function goToMenu() {

}
